<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zAgent · Web</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0f1115; color: #e4e4e7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #181a20; padding: 14px 20px; border-bottom: 1px solid #27272a;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; font-weight: 600; color: #a78bfa; }
  header .status { font-size: 12px; color: #a1a1aa; }
  header .status.online { color: #4ade80; }

  #chat { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #4f46e5; color: white; border-bottom-right-radius: 4px; }
  .msg.ai   { align-self: flex-start; background: #27272a; border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #7f1d1d; }
  .tool-card { align-self: flex-start; background: #1f2937; border-left: 3px solid #60a5fa;
               padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #cbd5e1;
               max-width: 82%; font-family: ui-monospace, Consolas, monospace; }
  .tool-card .name { color: #60a5fa; font-weight: 600; margin-bottom: 2px; }
  .tool-card .args { color: #94a3b8; font-size: 11px; }
  .tool-card .result { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #334155;
                       white-space: pre-wrap; font-size: 11px; }
  .tool-card.ok   .name { color: #34d399; }
  .tool-card.fail .name { color: #f87171; }

  #composer { padding: 14px 24px; background: #181a20; border-top: 1px solid #27272a;
              display: flex; gap: 10px; }
  #input    { flex: 1; background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46;
              border-radius: 8px; padding: 10px 14px; resize: none; font-size: 14px;
              font-family: inherit; max-height: 120px; min-height: 40px; }
  #input:focus { outline: none; border-color: #a78bfa; }
  #send     { background: #a78bfa; color: white; border: none; border-radius: 8px;
              padding: 0 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #send:disabled { background: #52525b; cursor: not-allowed; }

  .markdown h2 { font-size: 16px; margin: 10px 0 4px; color: #c4b5fd; }
  .markdown ul { padding-left: 18px; margin: 4px 0; }
  .markdown code { background: #3f3f46; padding: 1px 5px; border-radius: 3px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .markdown a { color: #60a5fa; text-decoration: none; }
  .markdown a:hover { text-decoration: underline; }
  .markdown blockquote { border-left: 3px solid #60a5fa; padding-left: 10px; color: #a1a1aa; margin: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>zAgent · Web</h1>
  <span class="status" id="status">连接中…</span>
</header>
<div id="chat"></div>
<div id="composer">
  <textarea id="input" placeholder="输入问题，Enter 发送（Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</div>

<script>
const chat  = document.getElementById('chat');
const input = document.getElementById('input');
const send  = document.getElementById('send');
const statusEl = document.getElementById('status');

statusEl.textContent = '就绪';
statusEl.classList.add('online');

let streaming = false;
let activeAiMsg = null;
let activeToolCard = null;

function appendMessage(role, html, cls='') {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function appendToolCard(name, args) {
  const div = document.createElement('div');
  div.className = 'tool-card';
  div.innerHTML = `<div class="name">🔧 ${name}</div><div class="args">${escapeHtml(JSON.stringify(args))}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  activeToolCard = div;
  return div;
}

function finishToolCard(ok, result) {
  if (!activeToolCard) return;
  activeToolCard.classList.add(ok ? 'ok' : 'fail');
  const snippet = result.length > 400 ? result.slice(0, 400) + '…（截断）' : result;
  const resDiv = document.createElement('div');
  resDiv.className = 'result';
  resDiv.textContent = (ok ? '✅ ' : '❌ ') + snippet;
  activeToolCard.appendChild(resDiv);
  activeToolCard = null;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || streaming) return;

  appendMessage('user', escapeHtml(text));
  input.value = '';
  streaming = true;
  send.disabled = true;
  statusEl.textContent = '思考中…';

  activeAiMsg = appendMessage('ai', '');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      body: JSON.stringify({ text }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        handleSseChunk(chunk);
      }
    }
  } catch (err) {
    appendMessage('error', '❌ 请求失败: ' + err.message);
  } finally {
    streaming = false;
    send.disabled = false;
    statusEl.textContent = '就绪';
    input.focus();
  }
}

function handleSseChunk(chunk) {
  let eventType = 'message';
  let dataStr = '';
  for (const line of chunk.split('\n')) {
    if (line.startsWith('event:')) eventType = line.slice(6).trim();
    else if (line.startsWith('data:')) dataStr += line.slice(5).trim();
  }
  if (!dataStr) return;
  let payload;
  try { payload = JSON.parse(dataStr); } catch { return; }

  switch (eventType) {
    case 'text_delta':
      if (!activeAiMsg) activeAiMsg = appendMessage('ai', '');
      activeAiMsg.innerHTML += escapeHtml(payload.text);
      chat.scrollTop = chat.scrollHeight;
      break;
    case 'tool_call_begin':
      appendToolCard(payload.name, payload.arguments);
      break;
    case 'tool_call_end':
      finishToolCard(payload.ok, payload.result);
      break;
    case 'turn_end':
      activeAiMsg = null;  // 下一 delta 开新块
      break;
    case 'error':
      appendMessage('error', '❌ ' + escapeHtml(payload.message));
      break;
  }
}

send.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.focus();
</script>
</body>
</html>
